<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Shailesh Gupta — Cloud Solution Architect, multi-cloud, hybrid cloud and AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#16163a"/>
      <stop offset="1" stop-color="#2a1250"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#7dcfff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0;0.4 0;-0.4 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bb9af7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="16" fill="url(#grid)"/>

  <!-- Cloud + AI network on the right -->
  <defs>
    <radialGradient id="glowAI" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7768e" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f7768e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bridge" gradientUnits="userSpaceOnUse" x1="1030" y1="0" x2="1100" y2="0">
      <stop offset="0" stop-color="#bb9af7"/><stop offset="1" stop-color="#f7768e"/>
    </linearGradient>
  </defs>
  <g stroke="#7aa2f7" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <path d="M800 70 L880 115 L960 70 M800 210 L880 165 L960 210 M880 115 L880 165 M800 70 L880 165 M800 210 L880 115"/>
    <path d="M960 70 L1010 140 M960 210 L1010 140 M880 115 L1010 140 M880 165 L1010 140"/>
  </g>
  <g stroke="#f7768e" stroke-opacity="0.45" stroke-width="1.5" fill="none">
    <path d="M1120 140 L1150 72 M1120 140 L1150 208"/>
  </g>
  <path d="M1030 140 L1100 140" stroke="url(#bridge)" stroke-width="3" stroke-dasharray="6 5">
    <animate attributeName="stroke-dashoffset" values="22;0" dur="1s" repeatCount="indefinite"/>
  </path>
  <!-- Data pulses: cloud skills flow into the cloud hub, then on to AI -->
  <g fill="#7dcfff">
    <circle r="3.5"><animateMotion dur="3s" repeatCount="indefinite" path="M800 70 L880 115 L1010 140 L1120 140"/></circle>
    <circle r="3.5"><animateMotion dur="3.4s" begin="0.9s" repeatCount="indefinite" path="M800 210 L880 165 L1010 140 L1120 140"/></circle>
    <circle r="3"><animateMotion dur="2.6s" begin="0.4s" repeatCount="indefinite" path="M960 70 L1010 140 L1120 140"/></circle>
    <circle r="3"><animateMotion dur="2.8s" begin="1.5s" repeatCount="indefinite" path="M960 210 L1010 140 L1120 140"/></circle>
  </g>
  <g fill="#f7768e">
    <circle r="3"><animateMotion dur="2.2s" repeatCount="indefinite" path="M1120 140 L1150 72"/></circle>
    <circle r="3"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" path="M1120 140 L1150 208"/></circle>
  </g>
  <!-- Cloud skill nodes -->
  <g fill="#1a1b27" stroke="#7aa2f7" stroke-width="2">
    <circle cx="800" cy="70" r="9"/><circle cx="880" cy="115" r="8"/><circle cx="960" cy="70" r="9"/>
    <circle cx="800" cy="210" r="9"/><circle cx="880" cy="165" r="8"/><circle cx="960" cy="210" r="9"/>
  </g>
  <!-- Cloud hub -->
  <circle cx="1010" cy="140" r="30" fill="url(#glow)" opacity="0.6"/>
  <circle cx="1010" cy="140" r="21" fill="#1a1b27" stroke="#bb9af7" stroke-width="2"/>
  <text x="1010" y="144" text-anchor="middle" font-size="10.5" font-weight="700" fill="#bb9af7">Cloud</text>
  <!-- AI hub -->
  <circle cx="1120" cy="140" r="34" fill="url(#glowAI)">
    <animate attributeName="r" values="26;40;26" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1120" cy="140" r="21" fill="#1a1b27" stroke="#f7768e" stroke-width="2.5"/>
  <text x="1120" y="145" text-anchor="middle" font-size="14" font-weight="800" fill="#f7768e">AI</text>
  <g fill="#1a1b27" stroke="#f7768e" stroke-width="2">
    <circle cx="1150" cy="72" r="8"/><circle cx="1150" cy="208" r="8"/>
  </g>
  <!-- Labels -->
  <g font-size="11" fill="#a9b1d6" class="mono">
    <text x="800" y="52" text-anchor="middle">migrate</text>
    <text x="960" y="52" text-anchor="middle">automate</text>
    <text x="800" y="238" text-anchor="middle">govern</text>
    <text x="960" y="238" text-anchor="middle">optimise</text>
    <text x="1150" y="54" text-anchor="middle" fill="#f7768e">LLMs</text>
    <text x="1150" y="236" text-anchor="middle" fill="#f7768e">RAG</text>
    <text x="1065" y="128" text-anchor="middle" font-size="10" fill="#c0caf5">GenAI</text>
  </g>

  <!-- Text block -->
  <text x="64" y="78" class="mono" font-size="15" fill="#7dcfff">$ whoami</text>
  <text x="64" y="138" font-size="52" font-weight="800" fill="url(#title)">Shailesh Gupta</text>
  <text x="64" y="180" font-size="22" font-weight="600" fill="#c0caf5">Cloud Solution Architect · Multi-cloud · Hybrid Cloud · AI</text>
  <text x="64" y="216" font-size="16" fill="#a9b1d6">AWS · Azure · GCP · Generative AI · Migration · Landing Zones · FinOps</text>
  <rect x="64" y="234" width="10" height="18" fill="#7dcfff">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
