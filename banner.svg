<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Shailesh Gupta — Cloud Solution Architect">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#16163a"/>
      <stop offset="1" stop-color="#2a1250"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#7dcfff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0;0.4 0;-0.4 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bb9af7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="16" fill="url(#grid)"/>

  <!-- Neural / cloud network on the right -->
  <g stroke="#7aa2f7" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <path d="M840 70 L930 120 L1030 80 L1110 140 L1030 200 L930 170 L840 210"/>
    <path d="M840 70 L930 170 M930 120 L1030 200 M930 120 L930 170 M1030 80 L1030 200 M840 210 L930 120"/>
    <path d="M1030 80 L1110 140 M1110 140 L1030 200"/>
  </g>
  <!-- Data pulses travelling along links -->
  <g fill="#7dcfff">
    <circle r="3.5"><animateMotion dur="3s" repeatCount="indefinite" path="M840 70 L930 120 L1030 80 L1110 140"/></circle>
    <circle r="3.5"><animateMotion dur="3.6s" begin="0.8s" repeatCount="indefinite" path="M840 210 L930 170 L1030 200 L1110 140"/></circle>
    <circle r="3"><animateMotion dur="2.6s" begin="0.4s" repeatCount="indefinite" path="M930 120 L930 170 L1030 200"/></circle>
  </g>
  <!-- Nodes -->
  <g>
    <circle cx="1110" cy="140" r="34" fill="url(#glow)">
      <animate attributeName="r" values="28;40;28" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1110" cy="140" r="20" fill="#1a1b27" stroke="#bb9af7" stroke-width="2"/>
    <text x="1110" y="144" text-anchor="middle" font-size="10.5" font-weight="700" fill="#bb9af7">Cloud</text>
  </g>
  <g fill="#1a1b27" stroke="#7aa2f7" stroke-width="2">
    <circle cx="840" cy="70" r="9"/><circle cx="930" cy="120" r="9"/><circle cx="1030" cy="80" r="9"/>
    <circle cx="840" cy="210" r="9"/><circle cx="930" cy="170" r="9"/><circle cx="1030" cy="200" r="9"/>
  </g>
  <g font-size="11" fill="#a9b1d6" class="mono">
    <text x="840" y="52" text-anchor="middle">migrate</text>
    <text x="1030" y="62" text-anchor="middle">automate</text>
    <text x="840" y="238" text-anchor="middle">govern</text>
    <text x="1030" y="228" text-anchor="middle">optimise</text>
  </g>

  <!-- Text block -->
  <text x="64" y="78" class="mono" font-size="15" fill="#7dcfff">$ whoami</text>
  <text x="64" y="138" font-size="52" font-weight="800" fill="url(#title)">Shailesh Gupta</text>
  <text x="64" y="180" font-size="22" font-weight="600" fill="#c0caf5">Cloud Solution Architect · AWS · Azure · Hybrid Cloud</text>
  <text x="64" y="216" font-size="16" fill="#a9b1d6">Solution Design · Migration · Landing Zones · IaC · Generative AI · FinOps</text>
  <rect x="64" y="234" width="10" height="18" fill="#7dcfff">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
