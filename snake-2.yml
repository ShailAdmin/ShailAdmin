# Redraws the profile visuals every day and publishes them to the "output"
# branch that README.md reads from:
#   - contribution snake animation (light + dark)
#   - 31-day contribution activity graph (light + dark)    -> .github/scripts/activity_graph.py
#   - stats, streak and repository cards (light + dark)     -> .github/scripts/profile_cards.py
# Everything is drawn here, so the README never depends on an outside image host.
name: Generate profile visuals

on:
  schedule:
    - cron: "0 0 * * *"   # daily at 00:00 UTC
  workflow_dispatch:       # lets you run it manually from the Actions tab
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Runs BEFORE the snake: the snake step runs in Docker as root and would
      # otherwise create dist/ owned by root, which this script can't write to.
      - name: Generate activity graph SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/activity_graph.py "${{ github.repository_owner }}" dist

      - name: Generate stats, streak and repository cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/profile_cards.py "${{ github.repository_owner }}" dist Cloud_Architect CheatSheet

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Fix file ownership
        run: sudo chown -R "$(id -u):$(id -g)" dist && ls -la dist

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
